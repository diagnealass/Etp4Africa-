<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Déclaration du charset UTF-8 pour les caractères spéciaux -->
    <meta charset="UTF-8">
    <!-- Meta viewport pour la responsivité mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titre de la page affiché dans l'onglet du navigateur -->
    <title>Google Clone - Groupe 2</title>
    <!-- Importation du fichier CSS personnalisé -->
    <link rel="stylesheet" href="style.css">
    <!-- Importation de la librairie Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- BARRE DE NAVIGATION SUPÉRIEURE -->
    <header>
        <!-- Conteneur des éléments de navigation à droite -->
        <div class="nav-right">
            <!-- Liens vers Gmail et Images -->
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <!-- Icône du menu hamburger -->
            <div class="nav-icon"><i class="fas fa-bars"></i></div>
     <!-- SECTION PRINCIPALE -->
    <main>
        <!-- Logo Google centré -->
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" class="logo">
        
        <!-- Barre de recherche avec icônes -->
        <div class="search-box">
            <!-- Icône de recherche -->
            <i class="fas fa-search search-icon"></i>
            <!-- Champ de saisie pour la requête de recherche -->
            <input type="text" class="search-input">
            <!-- Outils additionnels: microphone et appareil photo -->
            <div class="search-tools">
                <i class="fas fa-microphone"></i>
                <i class="fas fa-camera"></i>
            </div>
         <!-- Boutons d'action principaux -->
        <div class="buttons">
            <button>Recherche Google</button>
            <button>J'ai de la chance</button>
        </div>

        <!-- Section des langues disponibles -->
        <div class="language">
            Google disponible en : <a href="#">Wolof</a>
        </div>
    </main>

    <!-- PIED DE PAGE -->
    <footer>
        <!-- Information du pays/région en haut du pied de page -->
        <div class="footer-top">Sénégal</div>
        
        <!-- Conteneur principal des liens du pied de page -->
        <div class="footer-bottom">
            <!-- Première colonne: Liens À propos, Publicité et Entreprise -->
            <div class="footer-links">
                <!-- Lien vers la page À propos -->
                <a href="#">À propos</a>
                <!-- Lien vers les informations de publicité -->
                <a href="#">Publicité</a>
                <!-- Lien vers la page Entreprise -->
                <a href="#">Entreprise</a>
                <!-- Lien vers l'explication de la recherche Google -->
                <a href="#">Comment fonctionne la recherche Google ?</a>
            </div>
            
            <!-- Deuxième colonne: Liens Confidentialité, Conditions et Paramètres -->
            <div class="footer-links">
                <!-- Lien vers la politique de confidentialité -->
                <a href="#">Confidentialité</a>
                <!-- Lien vers les conditions d'utilisation -->
                <a href="#">Conditions</a>
                <!-- Lien vers les paramètres utilisateur -->
                <a href="#">Paramètres</a>
            </div>
        </div>
    </footer>
</body>
</html>
